<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f"/>
      <stop offset="50%" stop-color="#0e131d"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Master Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c59b27"/>
      <stop offset="50%" stop-color="#f3d069"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>

    <!-- Brain Hero Gradient -->
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2211"/>
      <stop offset="100%" stop-color="#141108"/>
    </linearGradient>

    <!-- Card Base -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#0d1118"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Markers -->
    <marker id="mainArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f3d069"/>
    </marker>
    <marker id="subArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="blueArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="purpleArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#c084fc"/>
    </marker>
    <marker id="greenArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#34d399"/>
    </marker>
  </defs>

  <style>
    .h-title { font-family: 'Cinzel', 'Georgia', serif; font-size: 24px; font-weight: 700; fill: #f3d069; letter-spacing: 2px; }
    .h-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; letter-spacing: 0.5px; }
    .stage-label { font-family: 'Cinzel', serif; font-size: 11px; font-weight: bold; fill: #d4af37; letter-spacing: 1.5px; }
    .box-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .box-bullet { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    .hero-title { font-family: 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 800; fill: #fef08a; }
    .hero-bullet { font-family: 'Inter', system-ui, sans-serif; font-size: 11.5px; fill: #cbd5e1; }
    .badge { font-family: 'Inter', monospace; font-size: 9.5px; font-weight: 600; fill: #facc15; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="940" fill="url(#bgCanvas)" rx="16"/>
  <rect x="15" y="15" width="1170" height="910" fill="none" stroke="#1e293b" stroke-width="1.2" rx="12"/>

  <!-- ================= HEADER ================= -->
  <g transform="translate(45, 30)">
    <text x="0" y="22" class="h-title">FEEL &amp; FILM</text>
    <text x="165" y="22" class="h-title" fill="#ffffff">— SYSTEM ARCHITECTURE</text>
    <text x="0" y="42" class="h-sub">Autonomous Multi-Agent Cinema Sanctuary • Google ADK &amp; Gemini 3.5 Flash • Google Lyria • ClickHouse Cloud</text>
    <line x1="0" y1="52" x2="1110" y2="52" stroke="url(#goldGrad)" stroke-width="1.8"/>
  </g>

  <!-- ================= STAGE 1: USER & CLIENT LAYER ================= -->
  <g transform="translate(45, 98)">
    <text x="0" y="10" class="stage-label">1. USER EMOTIONAL INPUT &amp; CLIENT UI</text>
    
    <!-- Box 1: Emotional Input -->
    <g transform="translate(0, 20)">
      <rect width="350" height="75" fill="url(#boxGrad)" stroke="#d4af37" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title">🎬 4-Scene Emotional Input</text>
      <text x="14" y="42" class="box-bullet">• Raw feelings &amp; desired atmosphere</text>
      <text x="14" y="60" class="box-bullet">• Dietary &amp; age boundaries (18+ / Kids)</text>
    </g>

    <!-- Box 2: Memory & Preferences -->
    <g transform="translate(380, 20)">
      <rect width="350" height="75" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title">🔑 Google Identity &amp; Active Profile</text>
      <text x="14" y="42" class="box-bullet">• OAuth 2.0 JWT Token verification</text>
      <text x="14" y="60" class="box-bullet">• Learned dietary &amp; style preference sync</text>
    </g>

    <!-- Box 3: Instant Re-roll & Safety -->
    <g transform="translate(760, 20)">
      <rect width="350" height="75" fill="url(#boxGrad)" stroke="#64748b" stroke-width="1" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title">🎲 Experience Controls</text>
      <text x="14" y="42" class="box-bullet">• 1-Click instant mood re-roll</text>
      <text x="14" y="60" class="box-bullet">• AI battery recharge safe mode</text>
    </g>
  </g>

  <!-- MAIN FLOW ARROW 1 -> 2 -->
  <line x1="600" y1="202" x2="600" y2="225" stroke="#f3d069" stroke-width="2.5" marker-end="url(#mainArrow)"/>

  <!-- ================= STAGE 2: SAFETY FILTER & FASTAPI GATEWAY ================= -->
  <g transform="translate(45, 232)">
    <text x="0" y="10" class="stage-label">2. RESPONSIBLE AI FILTER &amp; API GATEWAY</text>
    
    <g transform="translate(0, 20)">
      <rect width="1110" height="65" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1.5" rx="8" filter="url(#softGlow)"/>
      
      <!-- Sub-col A: Safety Guardrail -->
      <text x="20" y="24" class="box-title" fill="#fbbf24">🛡️ Layer 0: Safety Guardrail</text>
      <text x="20" y="44" class="box-bullet">• Multilingual NSFW &amp; violence filter</text>
      <text x="20" y="58" class="box-bullet">• Cinema director whitelist protection</text>

      <line x1="370" y1="10" x2="370" y2="55" stroke="#334155" stroke-width="1"/>

      <!-- Sub-col B: Core Router -->
      <text x="390" y="24" class="box-title" fill="#fde047">⚡ FastAPI Orchestration Engine</text>
      <text x="390" y="44" class="box-bullet">• Single autonomous execution cycle</text>
      <text x="390" y="58" class="box-bullet">• Asynchronous Uvicorn &amp; error recovery</text>

      <line x1="750" y1="10" x2="750" y2="55" stroke="#334155" stroke-width="1"/>

      <!-- Sub-col C: Alignment Matrix -->
      <text x="770" y="24" class="box-title" fill="#7dd3fc">📊 AI Alignment Matrix (Alt+A)</text>
      <text x="770" y="44" class="box-bullet">• Multi-constraint fidelity scoring (94.2%)</text>
      <text x="770" y="58" class="box-bullet">• Pareto trade-off arbitration audit</text>
    </g>
  </g>

  <!-- MAIN FLOW ARROW 2 -> 3 -->
  <line x1="600" y1="324" x2="600" y2="348" stroke="#f3d069" stroke-width="2.5" marker-end="url(#mainArrow)"/>

  <!-- ================= STAGE 3: MASTER ORCHESTRATOR (THE BRAIN) ================= -->
  <g transform="translate(45, 355)">
    <text x="0" y="10" class="stage-label">3. AUTONOMOUS MULTI-AGENT ORCHESTRATION (GOOGLE ADK)</text>
    
    <!-- Hero Brain Box -->
    <g transform="translate(0, 20)">
      <rect width="1110" height="78" fill="url(#brainGrad)" stroke="#d4af37" stroke-width="2" rx="10" filter="url(#goldGlow)"/>
      <text x="24" y="28" class="hero-title">🧠 Master Orchestrator Agent</text>
      <text x="240" y="28" class="badge">Google ADK • Gemini 3.5 Flash</text>
      <text x="24" y="50" class="hero-bullet">• Coordinates specialist sub-agents with shared memory and tool calling</text>
      <text x="24" y="66" class="hero-bullet">• Synthesizes Collaborative Partner Notes &amp; enforces past vault film deduplication</text>
      
      <!-- Right Tag -->
      <rect x="940" y="22" width="145" height="34" fill="#0b1120" stroke="#d4af37" stroke-width="1" rx="6"/>
      <text x="955" y="43" class="badge" fill="#fde047">1 Autonomous Cycle</text>
    </g>
  </g>

  <!-- FAN-OUT CONNECTORS 3 -> 4 (Sub-Agents) -->
  <path d="M 600 458 L 600 478" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M 155 478 L 1045 478" fill="none" stroke="#d4af37" stroke-width="1.8"/>
  <line x1="155" y1="478" x2="155" y2="495" stroke="#d4af37" stroke-width="1.8" marker-end="url(#mainArrow)"/>
  <line x1="375" y1="478" x2="375" y2="495" stroke="#d4af37" stroke-width="1.8" marker-end="url(#mainArrow)"/>
  <line x1="600" y1="478" x2="600" y2="495" stroke="#d4af37" stroke-width="1.8" marker-end="url(#mainArrow)"/>
  <line x1="825" y1="478" x2="825" y2="495" stroke="#d4af37" stroke-width="1.8" marker-end="url(#mainArrow)"/>
  <line x1="1045" y1="478" x2="1045" y2="495" stroke="#d4af37" stroke-width="1.8" marker-end="url(#mainArrow)"/>

  <!-- ================= STAGE 4: SPECIALIST SUB-AGENTS ================= -->
  <g transform="translate(45, 502)">
    <!-- Sub-Agent 1: Curator -->
    <g transform="translate(0, 0)">
      <rect width="210" height="95" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="12" y="22" class="box-title" fill="#7dd3fc">🎥 Film Curator</text>
      <text x="12" y="42" class="box-bullet">• Semantic mood discovery</text>
      <text x="12" y="58" class="box-bullet">• Directors, studios &amp; eras</text>
      <text x="12" y="74" class="box-bullet">• Age constraint filter (G/PG)</text>
      <text x="12" y="88" class="badge" fill="#38bdf8">Live TMDB Tool</text>
    </g>

    <!-- Sub-Agent 2: Soundtrack -->
    <g transform="translate(225, 0)">
      <rect width="210" height="95" fill="url(#boxGrad)" stroke="#818cf8" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="12" y="22" class="box-title" fill="#c7d2fe">🎵 Soundtrack Maestro</text>
      <text x="12" y="42" class="box-bullet">• Score musicology analysis</text>
      <text x="12" y="58" class="box-bullet">• Composer &amp; standout track</text>
      <text x="12" y="74" class="box-bullet">• Acoustic emotional atmosphere</text>
      <text x="12" y="88" class="badge" fill="#818cf8">Gemini 3.5 Flash</text>
    </g>

    <!-- Sub-Agent 3: Sommelier -->
    <g transform="translate(450, 0)">
      <rect width="210" height="95" fill="url(#boxGrad)" stroke="#f472b6" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="12" y="22" class="box-title" fill="#fbcfe8">🍿 Cinema Sommelier</text>
      <text x="12" y="42" class="box-bullet">• Artisanal drink &amp; snack pairing</text>
      <text x="12" y="58" class="box-bullet">• 100% Non-alcoholic &amp; vegan</text>
      <text x="12" y="74" class="box-bullet">• Strict dietary enforcement</text>
      <text x="12" y="88" class="badge" fill="#f472b6">Dietary Partner</text>
    </g>

    <!-- Sub-Agent 4: Courier -->
    <g transform="translate(675, 0)">
      <rect width="210" height="95" fill="url(#boxGrad)" stroke="#60a5fa" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="12" y="22" class="box-title" fill="#93c5fd">✉️ Cinema Courier</text>
      <text x="12" y="42" class="box-bullet">• Bespoke HTML Cinema Epistle</text>
      <text x="12" y="58" class="box-bullet">• Kitchen concession recipes</text>
      <text x="12" y="74" class="box-bullet">• 1-Click SMTP email dispatch</text>
      <text x="12" y="88" class="badge" fill="#60a5fa">Concierge Agent</text>
    </g>

    <!-- Sub-Agent 5: Constellation -->
    <g transform="translate(900, 0)">
      <rect width="210" height="95" fill="url(#boxGrad)" stroke="#c084fc" stroke-width="1.5" rx="8" filter="url(#softGlow)"/>
      <text x="12" y="22" class="box-title" fill="#e9d5ff">🌌 Constellation Cartography</text>
      <text x="12" y="42" class="box-bullet">• 3D Asterism with Z-depth</text>
      <text x="12" y="58" class="box-bullet">• 5s Melodic Leitmotif score</text>
      <text x="12" y="74" class="box-bullet">• Cinematic acoustic timbres</text>
      <text x="12" y="88" class="badge" fill="#c084fc">Google Lyria Engine</text>
    </g>
  </g>

  <!-- CONNECTORS 4 -> 5 (Cloud Services) -->
  <line x1="155" y1="604" x2="225" y2="648" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#blueArrow)"/>
  <line x1="1045" y1="604" x2="600" y2="648" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#purpleArrow)"/>
  <line x1="600" y1="604" x2="975" y2="648" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#greenArrow)"/>

  <!-- ================= STAGE 5: DATA, AUDIO & CLOUD INFRASTRUCTURE ================= -->
  <g transform="translate(45, 650)">
    <text x="0" y="10" class="stage-label">4. DATA, AUDIO SYNTHESIS &amp; CLOUD INFRASTRUCTURE</text>
    
    <!-- Cloud 1: TMDB & JustWatch -->
    <g transform="translate(0, 20)">
      <rect width="350" height="78" fill="url(#boxGrad)" stroke="#38bdf8" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title" fill="#7dd3fc">🎬 TMDB &amp; JustWatch Live</text>
      <text x="14" y="42" class="box-bullet">• 800,000+ Film global catalog metadata</text>
      <text x="14" y="58" class="box-bullet">• Official HD posters &amp; regional streaming links</text>
      <text x="14" y="72" class="badge" fill="#38bdf8">Real-Time Data Feed</text>
    </g>

    <!-- Cloud 2: Google Lyria DSP -->
    <g transform="translate(380, 20)">
      <rect width="350" height="78" fill="url(#boxGrad)" stroke="#c084fc" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title" fill="#e9d5ff">🎵 Google Lyria &amp; WebAudio DSP</text>
      <text x="14" y="42" class="box-bullet">• Procedural cathedral convolution reverb</text>
      <text x="14" y="58" class="box-bullet">• Polyphonic analog chorus &amp; sub-bass pads</text>
      <text x="14" y="72" class="badge" fill="#c084fc">0-Latency Browser Sound</text>
    </g>

    <!-- Cloud 3: ClickHouse Cloud -->
    <g transform="translate(760, 20)">
      <rect width="350" height="78" fill="url(#boxGrad)" stroke="#eab308" stroke-width="1.2" rx="8" filter="url(#softGlow)"/>
      <text x="14" y="22" class="box-title" fill="#fde047">🗄️ ClickHouse Cloud (OLAP)</text>
      <text x="14" y="42" class="box-bullet">• Session &amp; audience memory storage</text>
      <text x="14" y="58" class="box-bullet">• Emotional / cinematic analytics &amp; ratings</text>
      <text x="14" y="72" class="badge" fill="#fde047">High-Speed Cloud Vault</text>
    </g>
  </g>

  <!-- MAIN FLOW ARROW 5 -> 6 -->
  <line x1="600" y1="755" x2="600" y2="780" stroke="#f3d069" stroke-width="2.5" marker-end="url(#mainArrow)"/>

  <!-- ================= STAGE 6: THE CINEMA EXPERIENCE OUTCOME ================= -->
  <g transform="translate(45, 788)">
    <text x="0" y="10" class="stage-label">5. COMPLETE CINEMA NIGHT DELIVERABLE &amp; MEMORY LOOP</text>
    
    <g transform="translate(0, 18)">
      <rect width="1110" height="75" fill="url(#brainGrad)" stroke="#d4af37" stroke-width="1.8" rx="10" filter="url(#goldGlow)"/>
      
      <!-- Deliverables List -->
      <text x="24" y="28" class="hero-title" fill="#fef08a">✨ Complete Cinema Sanctuary Experience</text>
      <text x="24" y="50" class="hero-bullet">🎬 Curated Auteur Film • 🎵 OST Musicology • 🍿 Dietary Concession • ✉️ Email Epistle • 🌌 3D Constellation</text>
      
      <!-- Collaborative Feedback Loop Note -->
      <g transform="translate(780, 14)">
        <rect width="305" height="48" fill="#0b1120" stroke="#34d399" stroke-width="1" rx="6"/>
        <text x="12" y="20" class="box-title" font-size="11.5" fill="#6ee7b7">🔄 Active Memory Loop (ClickHouse)</text>
        <text x="12" y="38" class="box-bullet" font-size="10.5">Learns ratings &amp; constraints for next session</text>
      </g>
    </g>
  </g>

</svg>
